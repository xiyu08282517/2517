<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晨小安 · 达人名录查询</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --line2:#eef0f3;
  --tx:#1c1f23; --tx2:#5f6773; --tx3:#98a1ad;
  --brand:#e8603c; --brand2:#ff7a55; --brandbg:#fff2ee;
  --ok:#12a150; --okbg:#e8f8ef; --warn:#c47f17; --warnbg:#fff7e6;
  --blue:#2f6fed; --bluebg:#eef4ff; --purple:#7c4dff; --purplebg:#f3efff;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
body{font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700}
.logo small{font-weight:400;color:var(--tx3);font-size:12px;margin-left:2px}
.searchbox{flex:1;min-width:260px;position:relative}
.searchbox input{width:100%;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 78px 0 38px;font-size:14px;background:#fff;outline:none;transition:.15s}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px;pointer-events:none}
.searchbox .clr{position:absolute;right:64px;top:50%;transform:translateY(-50%);border:0;background:#eef0f3;color:var(--tx2);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;display:none}
.searchbox .clr.on{display:block}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--tx);font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
.btn:hover{border-color:#cfd4db;background:#fafbfc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:#d5532f;border-color:#d5532f}

/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:0 auto;padding:18px 20px 60px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;display:flex;align-items:baseline;gap:7px;box-shadow:var(--shadow)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--tx2)}
.stat.hi b{color:var(--brand)}

.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.frow{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fgroup>label{font-size:12px;color:var(--tx2);font-weight:600;white-space:nowrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--tx2);transition:.13s;font-family:inherit}
.chip:hover{border-color:#cfd4db;color:var(--tx)}
.chip.on{background:var(--brandbg);border-color:var(--brand);color:var(--brand);font-weight:600}
select,.numin{height:32px;border:1.5px solid var(--line);border-radius:8px;padding:0 9px;font-size:13px;background:#fff;outline:none;font-family:inherit;color:var(--tx)}
select:focus,.numin:focus{border-color:var(--brand)}
.numin{width:88px}
.fdiv{width:1px;height:22px;background:var(--line)}
.meta-line{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2);font-size:12.5px;color:var(--tx2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.meta-line b{color:var(--brand)}

/* ---------- similar mode ---------- */
.modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mode{display:flex;background:#eceef1;border-radius:10px;padding:3px;gap:3px}
.mode button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--tx2);font-family:inherit;font-weight:600;transition:.15s;white-space:nowrap}
.mode button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.mode .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}

.simcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.simcard>h3{font-size:13.5px;padding:11px 16px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--tx)}
.simcard>h3 .n{color:var(--tx3);font-weight:400;font-size:12.5px}
.simcard>h3 .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.badge.p{background:var(--okbg);color:#0b7a3d}
.badge.s{background:var(--purplebg);color:var(--purple)}
.badge.t{background:var(--bluebg);color:var(--blue)}
.badge.w{background:var(--warnbg);color:var(--warn)}

/* ---------- duplicate warning ---------- */
.dupcard{background:var(--card);border:1px solid #f0dcb8;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.dupcard>h3{font-size:13.5px;padding:11px 16px;border-bottom:1px solid var(--line2);background:var(--warnbg);display:flex;align-items:center;gap:8px;font-weight:600;color:#8a5a08}
.dupcard>h3 b{color:var(--warn)}
.dupbody{padding:6px 16px 12px}
.duprow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.duprow:last-child{border-bottom:0}
.dupnick{font-weight:600;font-size:13px;min-width:130px}
.dupids{display:flex;gap:7px;flex-wrap:wrap}
.dupchip{font-size:11.5px;background:#f5f6f8;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--tx2);font-family:ui-monospace,Consolas,monospace}

/* ---------- empty state / 录入引导 ---------- */
.empty-state{padding:46px 20px;text-align:center}
.empty-state .ic{font-size:34px;margin-bottom:10px;opacity:.5}
.empty-state b{display:block;font-size:15.5px;color:var(--tx);margin-bottom:7px}
.empty-state p{font-size:13px;color:var(--tx2);margin-bottom:18px;line-height:1.7}
.empty-state .acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.empty-state .sub{margin-top:16px;font-size:12px;color:var(--tx3)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;place-items:center;z-index:400;padding:20px;backdrop-filter:blur(2px)}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(16,24,40,.28);overflow:hidden}
.mhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fafbfc}
.mhead b{font-size:15px}
.mclose{margin-left:auto;border:0;background:#eef0f3;width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--tx2);font-size:13px;line-height:1}
.mclose:hover{background:#e2e5e9}
.mbody{padding:16px 18px;overflow:auto;flex:1}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;background:#fafbfc}
.mtip{font-size:12px;color:var(--tx3)}
.mtip.err{color:#d64545}
.mtip.ok{color:var(--ok)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fitem{display:flex;flex-direction:column;gap:5px}
.fitem.wide{grid-column:1/-1}
.fitem label{font-size:12px;color:var(--tx2);font-weight:600}
.fitem label .req{color:var(--brand)}
.fitem input,.fitem select,.fitem textarea{height:36px;border:1.5px solid var(--line);border-radius:9px;padding:0 11px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;color:var(--tx)}
.fitem textarea{height:64px;padding:9px 11px;resize:vertical}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.fitem input[readonly]{background:#f5f6f8;color:var(--tx3);cursor:not-allowed}
.mnote{background:var(--bluebg);border:1px solid #d6e4ff;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#2b5cbf;margin-bottom:14px;line-height:1.65}
.mnote.warn{background:var(--warnbg);border-color:#f0dcb8;color:#8a5a08}
.mnote.ok{background:var(--okbg);border-color:#cfeee0;color:#0b7a3d}

/* ---------- 导入表格 ---------- */
.mbox.wide{max-width:940px}
.impdrop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;background:#fafbfc;transition:.15s;cursor:pointer}
.impdrop:hover,.impdrop.on{border-color:var(--brand);background:var(--brandbg)}
.impdrop .big{font-size:30px;color:var(--tx3);line-height:1}
.impdrop .t1{font-size:14px;font-weight:600;margin-top:10px}
.impdrop .t2{font-size:12px;color:var(--tx3);margin-top:5px}
.impstat{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 12px}
.impstat .s{flex:1;min-width:100px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}
.impstat .s b{display:block;font-size:19px;line-height:1.25}
.impstat .s span{font-size:11.5px;color:var(--tx3)}
.impstat .s.ok b{color:var(--ok)} .impstat .s.warn b{color:var(--warn)} .impstat .s.info b{color:var(--blue)}
.impmap{width:100%;border-collapse:collapse;font-size:12.5px}
.impmap th{background:#f7f8fa;color:var(--tx3);font-weight:600;text-align:left;padding:8px 10px;border:1px solid var(--line2);font-size:11.5px}
.impmap td{padding:7px 10px;border:1px solid var(--line2);vertical-align:middle}
.impmap select{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:12.5px;background:#fff;outline:none}
.impmap select:focus{border-color:var(--brand)}
.impmap .colname{font-family:ui-monospace,Consolas,monospace;color:var(--tx2)}
.impmap .hit{color:var(--ok);font-size:11px;font-weight:600}
.impmap .miss{color:var(--tx3);font-size:11px}
.impprev{overflow:auto;max-height:250px;border:1px solid var(--line);border-radius:9px}
.impprev table{border-collapse:collapse;font-size:12px;min-width:100%}
.impprev th{background:#f7f8fa;color:var(--tx2);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.impprev td{padding:6px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.impprev tr:last-child td{border-bottom:0}
.impsep{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.impsep::after{content:'';flex:1;height:1px;background:var(--line2)}
.mrow-hit{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px;font-size:12.5px}
.mrow-hit b{font-size:13px}
.mrow-hit .kv{color:var(--tx2);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.simbody{display:flex;gap:0;flex-wrap:wrap}
.simblock{flex:1;min-width:270px;padding:12px 16px;border-right:1px solid var(--line2)}
.simblock:last-child{border-right:0}
.simblock h4{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.simrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.12s}
.simrow:hover{background:#fafbfc}
.simrow .nm{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.simrow .sc{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.simrow .mini{font-size:11.5px;color:var(--tx2);white-space:nowrap}
.simempty{font-size:12.5px;color:var(--tx3);padding:6px 0}

/* ---------- 公告区 ---------- */
.notice{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#fff8f0,#fff2ee);
  border:1px solid #ffdcc9;border-left:4px solid var(--brand);border-radius:12px;
  padding:13px 16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.notice.off{display:none}
.nicon{font-size:19px;line-height:1.2;flex-shrink:0}
.nbody{flex:1;min-width:0}
.ntitle{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:5px;letter-spacing:.5px}
.nlist{list-style:none;display:flex;flex-direction:column;gap:4px}
.nlist li{font-size:13px;color:var(--tx);line-height:1.7;padding-left:14px;position:relative}
.nlist li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand);opacity:.55}
.nlist b{color:var(--brand)}
.nwx{font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px dashed var(--brand);
  border-radius:6px;padding:1px 8px;cursor:pointer;transition:.13s;display:inline-block}
.nwx:hover{background:var(--brand);color:#fff;border-style:solid}
.ncopy{font-size:11px;color:var(--tx3);margin-left:5px;font-weight:400}
.nclose{position:absolute;right:9px;top:9px;border:0;background:transparent;color:var(--tx3);
  cursor:pointer;font-size:13px;line-height:1;padding:4px 6px;border-radius:6px;transition:.13s}
.nclose:hover{background:rgba(0,0,0,.06);color:var(--tx)}
@media(max-width:640px){.notice{padding:12px 13px}.nlist li{font-size:12.5px}}

/* ---------- table ---------- */
.tablecard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tscroll{overflow:auto;max-height:calc(100vh - 300px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:1500px}
thead th{position:sticky;top:0;z-index:5;background:#fafbfc;border-bottom:1.5px solid var(--line);padding:10px 11px;text-align:left;font-weight:600;font-size:12.5px;color:var(--tx2);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#f2f4f6}
thead th .ar{color:var(--tx3);font-size:10px;margin-left:3px}
thead th.sorted{color:var(--brand)}
thead th.sorted .ar{color:var(--brand)}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:#fcfcfd}
tbody tr:last-child td{border-bottom:0}
td.nick{font-weight:600;min-width:150px;max-width:230px}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.wx{min-width:120px}
.wxval{display:inline-flex;align-items:center;gap:5px;background:var(--okbg);color:#0b7a3d;border-radius:6px;padding:2px 7px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;cursor:pointer;border:1px solid #cfeee0;max-width:100%}
.wxval:hover{background:#d9f2e5}
.wxval .cp{font-size:10px;opacity:.55}
.wxval.empty{background:transparent;border:0;color:var(--tx3);cursor:default}

/* 通用可复制单元格：点击即复制 */
.cpv{display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:5px;
  padding:1px 5px;margin:-1px -5px;transition:background .13s;max-width:100%}
.cpv>span:first-child{overflow:hidden;text-overflow:ellipsis}
.cpv .cp{font-size:10px;opacity:0;color:var(--brand);transition:opacity .13s;flex-shrink:0}
.cpv:hover{background:var(--brandbg)}
.cpv:hover .cp{opacity:.7}
.cpv:active{background:#ffe2d8}
.cpv.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
/* 昵称：加粗不变 */
.cpv.nickv{font-weight:600}
/* 复制成功的瞬间反馈 */
.cpv.copied{background:var(--okbg)}
.cpv.copied .cp{opacity:1;color:var(--ok)}
/* 整行复制反馈 */
tr.row-copied>td{background:var(--okbg)!important;transition:background .18s}
/* 地址可换行显示，不截断 */
td.addr .cpv{align-items:flex-start;white-space:normal;line-height:1.5}
td.addr .cpv>span:first-child{white-space:normal;word-break:break-all}

.empty{color:var(--tx3)}
.unk{display:inline-block;color:#9aa3ae;background:#f2f3f5;border:1px dashed #d9dde2;border-radius:5px;padding:0.5px 7px;font-size:11.5px;font-style:normal}
.chip.unkchip{border-style:dashed;color:#8a929c}
.chip.unkchip.on{background:#f2f3f5;border-color:#98a1ad;color:var(--tx2)}
.tag{display:inline-block;font-size:11.5px;padding:1.5px 7px;border-radius:5px;background:#eef0f3;color:var(--tx2);white-space:nowrap}
.tag.plat{background:var(--bluebg);color:var(--blue)}
.tag.lv{background:var(--warnbg);color:var(--warn);font-weight:600}
.tag.lv.none{background:#f2f3f5;color:var(--tx3);font-weight:400}
.tag.track{background:var(--purplebg);color:var(--purple);font-weight:600}
.tag.cate{background:#e7f6f0;color:#0d7a5c;font-weight:600}

/* ---------- 异常标 / 团标识 ---------- */
td.cent{text-align:center;white-space:nowrap}
.abn{display:inline-block;background:#fdeaea;color:#c62828;border:1px solid #f5c2c2;border-radius:6px;
     padding:2px 9px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.abn:hover{background:#fbdcdc}
.abn-add{display:inline-block;color:#c3cad2;font-size:11.5px;cursor:pointer;border:1px dashed #d9dde2;
     border-radius:6px;padding:2px 8px;white-space:nowrap;transition:.13s}
.abn-add:hover{color:#c62828;border-color:#f0b8b8;background:#fef6f6}
.team{display:inline-block;background:#eef4ff;color:#2f6fed;border:1px solid #d6e4ff;border-radius:6px;
     padding:2px 8px;font-size:11px;font-weight:600;cursor:help;white-space:nowrap}
tr.row-abn{background:#fff6f6}
tr.row-abn:hover{background:#ffeeee}
tr.row-team td:nth-child(18){background:#f7faff}

/* 异常/团 提示条 */
.warnbar{background:var(--card);border:1px solid #f5c2c2;border-radius:12px;padding:12px 16px;margin-bottom:14px;
     box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.warnbar .wi{font-size:19px;line-height:1}
.warnbar b{font-size:13.5px;color:#c62828;display:block;margin-bottom:3px}
.warnbar p{font-size:12.5px;color:var(--tx2);line-height:1.65;margin:0}
.warnbar .list{margin-top:6px;font-size:12.5px;color:var(--tx2)}
.chip.warnc{border-color:#f0c8c8}
.chip.warnc.on{background:#fdeaea;border-color:#e57373;color:#c62828}
.chip.infoc{border-color:#d6e4ff}
.chip.infoc.on{background:#eef4ff;border-color:#2f6fed;color:#2f6fed}
td.addr{min-width:220px;max-width:340px;color:var(--tx2);font-size:12.5px;white-space:normal}
td.uid{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--tx2);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.mark-row{background:#fffaf7}
tr.mark-row:hover{background:#fff5f0}
.tagsrc{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;margin-left:6px;vertical-align:middle;font-weight:600}
.tagsrc.remote{background:var(--okbg);color:#0b7a3d}
.tagsrc.local{background:var(--warnbg);color:var(--warn)}

.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.pager button{min-width:33px;height:33px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2);font-family:inherit;transition:.13s}
.pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .info{font-size:12.5px;color:var(--tx2);margin:0 8px}

window.__CHUNKS__ = [];
window.__CHUNK__ = function (i, rows) { window.__CHUNKS__[i] = rows; };
</script>
<script src="data/part01.js"></script>
<script src="data/part02.js"></script>
<script src="data/part03.js"></script>
<script src="data/part04.js"></script>

<script>
(function () {
  'use strict';
  const HEADER = ['平台','达人昵称','达人号','达人UID','粉丝数','带货类型','带货等级','近30日销量','达人微信号','达人微信号2','达人微信号3','收货人','收货人手机号','收货人地址','达人赛道','带货分类','异常','团标识'];
  const IDX = {plat:0,nick:1,handle:2,uid:3,fans:4,type:5,level:6,sales:7,wx1:8,wx2:9,wx3:10,recv:11,phone:12,addr:13,track:14,cate:15,abn:16,team:17};
  const NCOL = HEADER.length;   // 18
  const PER = 50;
  const CAND_MAX = 150;   // 相似候选池上限，防止卡顿

  // flatten
  // ============================================================
  //  赛道体系（粗口径 · BD 沟通友好）
  //  说明：曾考虑直接用蝉妈妈官方体系，但官方「达人分类」29 项 / 「带货分类」26 项
  //  太碎（给算法用的）。本表改用口语化大类，一眼看懂"这人是干啥的"。
  // ============================================================
  // ① 达人分类（内容向）—— 粗口径 11 项，BD 沟通友好
  const TRACKS = [
    '颜值美妆','美食吃播','厨房做菜','运动健身','知识技能','生活Vlog',
    '搞笑剧情','宝妈亲子','游戏音乐','三农特产','其他类型'
  ];
  // ② 带货分类（品类向）—— 粗口径 10 项
  const CATES = [
    '食品饮料','美妆个护','母婴用品','家居日用','服饰鞋包',
    '生鲜果蔬','保健养生','数码家电','图书教育','其他'
  ];
  // 异常标记（单一开关，用户决定）
  const ABNORMAL = '异常';

  // 扩展列索引（在原有 14 列之后追加）
  const EX = { track:14, cate:15, abn:16, team:17 };

  const ALL = [];
  (window.__CHUNKS__ || []).forEach(rows => { if (rows) rows.forEach(r => ALL.push(r)); });

  // ---------- 团标识自动统计 ----------
  // 规则：同一「收货人」或「手机号」被 ≥3 个不同达人共用 → 可能是内部团/外部团联系方式
  // 判据用「达人号/UID」去重计数，避免同一人多条记录误判
  //
  // 关键坑（实测）：收货人字段里 90% 是「王女士」「李先生」「陈小姐」这类
  // 姓氏+称谓的通用称呼，天然被大量不同达人共用。若不排除，
  // 会把 22.6% 的行误标成"团"——全是噪声。所以收货人必须过黑名单。
  const TEAM_MIN = 3;
  const RECV_GENERIC = /^([赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳酆鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹姚邵湛汪祁毛禹狄米贝明臧计伏成戴谈宋茅庞熊纪舒屈项祝董梁杜阮蓝闵席季麻强贾路娄危江童颜郭梅盛林刁钟徐邱骆高夏蔡田樊胡凌霍虞万支柯昝管卢莫经房裘缪干解应宗丁宣贲邓郁单杭洪包诸左石崔吉钮龚程嵇邢滑裴陆荣翁荀羊於惠甄曲家封芮羿储靳汲邴糜松井段富巫乌焦巴弓牧隗山谷车侯宓蓬全郗班仰秋仲伊宫宁仇栾暴甘钭历戎祖武符刘景詹束龙叶幸司韶郜黎蓟薄印宿白怀蒲邰从鄂索咸籍赖卓蔺屠蒙池乔阴鬱胥能苍双闻莘党翟谭贡劳逄姬申扶堵冉宰郦雍卻璩桑桂濮牛寿通边扈燕冀郏浦尚农温别庄晏柴瞿阎充慕连茹习宦艾鱼容向古易慎戈廖庾终暨居衡步都耿满弘匡国文寇广禄阙东欧殳沃利蔚越夔隆师巩厍聂晁勾敖融冷訾辛阚那简饶空曾毋沙乜养鞠须丰巢关蒯相查后荆红游竺权逯盖益桓公])[先生女士小姐太太老师总工经理老板叔姨爷爷奶奶哥姐弟妹]*$/;
  const RECV_BAD = /^(未知|匿名|待定|暂无|测试|张三|李四|王五|买家|客户|亲|无|空|。|\.|-+)$/;
  // 判定收货人名是否"有辨识度"：非通用称呼、长度≥3、含非姓氏信息
  function recvIsUseful(s){
    if (!s) return false;
    const t = String(s).trim();
    if (t.length < 3) return false;          // 「李」「王周」太短，无辨识度
    if (RECV_BAD.test(t)) return false;
    if (RECV_GENERIC.test(t)) return false;  // 「王女士」「李先生」
    // 只由 姓氏+称谓 组成但总长≥4 的，如「欧阳女士」→ 仍算通用
    if (/^[\u4e00-\u9fa5]{1,2}(先生|女士|小姐|太太|老师)$/.test(t)) return false;
    return true;
  }

  let _teamSet = null;          // Set<row> 命中团标识的行
  let _teamInfo = null;         // Map<row, {recv:n, phone:n}>
  function buildTeamIndex(){
    if (_teamSet) return;
    _teamSet = new Set(); _teamInfo = new Map();
    const byRecv = new Map(), byPhone = new Map();
    const vid = r => (r[2]||r[3]||r[1]||'');   // 达人身份：号 > UID > 昵称
    ALL.forEach(r=>{
      const rcRaw = isUnk(r[11]) ? null : String(r[11]).trim();
      const rc = rcRaw && recvIsUseful(rcRaw) ? rcRaw : null;   // 通用称呼不参与统计
      const ph = isUnk(r[12]) ? null : String(r[12]).trim();
      if (rc){ if(!byRecv.has(rc)) byRecv.set(rc, new Set()); byRecv.get(rc).add(vid(r)); }
      if (ph){ if(!byPhone.has(ph)) byPhone.set(ph, new Set()); byPhone.get(ph).add(vid(r)); }
    });
    ALL.forEach(r=>{
      const rcRaw = isUnk(r[11]) ? null : String(r[11]).trim();
      const rc = rcRaw && recvIsUseful(rcRaw) ? rcRaw : null;
      const ph = isUnk(r[12]) ? null : String(r[12]).trim();
      const nr = rc && byRecv.has(rc) ? byRecv.get(rc).size : 0;
      const np = ph && byPhone.has(ph) ? byPhone.get(ph).size : 0;
      const hitR = nr >= TEAM_MIN, hitP = np >= TEAM_MIN;
      if (hitR || hitP){
        _teamSet.add(r);
        _teamInfo.set(r, {recv: hitR ? nr : 0, phone: hitP ? np : 0, recvVal: rc||'', phoneVal: ph||''});
      }
    });
  }
  const isTeam = r => { buildTeamIndex(); return _teamSet.has(r); };
  const teamInfo = r => { buildTeamIndex(); return _teamInfo.get(r) || null; };

  const state = {q:'', plat:new Set(), type:new Set(), level:'', fmin:'', fmax:'', onlyWx:false,
                 salesUnk:false, wxUnk:false, fansUnk:false, hideUnk:false,
                 track:new Set(), cate:new Set(), onlyAbn:false, onlyTeam:false,
                 page:1, sortKey:-1, sortDir:-1, result:ALL, sim:false, simInfo:null, markSet:null,
                 scored:false, scoreMap:null, exactN:0, dupGroups:null, terms:[]};

  const UNK = '未知';

  // ---------- helpers ----------
  const $ = s => document.querySelector(s);
  const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt = n => { n=Number(n)||0; return n>=10000 ? (n/10000).toFixed(n>=100000?0:1)+'万' : n.toLocaleString('zh-CN'); };
  const hasWx = r => !!(r[8]||r[9]||r[10]);
  // 空值判定：空串 / 0 视为未知
  const isUnk = v => !v || v === 0 || v === '0';

  // ---------- 关键词权重排序 ----------
  // 权重表：越"唯一"的字段权重越高。命中位置越靠前、字段越精确 → 分越高
  // nick 100/80(前缀) > handle 70 > uid 68 > wx 50 > recv 30 > phone 25 > addr 10
  function fieldScore(v, t, exact, prefix, contains){
    if (isUnk(v)) return 0;
    const s = String(v).toLowerCase();
    if (s === t) return exact;
    if (s.startsWith(t)) return prefix;
    if (s.includes(t)) return contains;
    return 0;
  }
  // 单行加权得分
  function rowScore(r, terms){
    let total = 0;
    for (const t of terms){
      let best = 0, hitField = -1;
      const cand = [
        [1,  fieldScore(r[1], t, 100, 88, 74)],   // 达人昵称
        [2,  fieldScore(r[2], t, 70, 66, 58)],    // 达人号
        [3,  fieldScore(r[3], t, 68, 64, 56)],    // 达人UID
        [8,  fieldScore(r[8], t, 50, 46, 40)],    // 微信1
        [9,  fieldScore(r[9], t, 50, 46, 40)],    // 微信2
        [10, fieldScore(r[10],t, 50, 46, 40)],    // 微信3
        [11, fieldScore(r[11],t, 22, 19, 14)],    // 收货人（多为代收/云仓，降权）
        [12, fieldScore(r[12],t, 25, 23, 18)],    // 手机号
        [13, fieldScore(r[13],t, 8,  7,  5)],     // 地址（区分度低，重降权）
        [0,  fieldScore(r[0], t, 6,   5,  4)],    // 平台
        [5,  fieldScore(r[5], t, 5,   4,  3)],    // 带货类型
        [6,  fieldScore(r[6], t, 4,   3,  2)],    // 带货等级
        [14, fieldScore(r[14],t, 30, 26, 20)],    // 达人赛道（内容向，可搜"宝妈""美食"）
        [15, fieldScore(r[15],t, 28, 24, 18)],    // 带货分类（品类向，可搜"母婴用品"）
      ];
      for (const [idx, sc] of cand){ if (sc > best){ best = sc; hitField = idx; } }
      if (best === 0) return -1;               // 该词完全没命中 → 整行出局
      total += best;
      // 昵称/达人号/UID 命中 → 核心标识，额外加成
      if (hitField === 1) total += 20;
      else if (hitField === 2 || hitField === 3) total += 12;
      else if (hitField >= 8 && hitField <= 10) total += 6;   // 微信命中，联系价值高
    }
    // 有微信的排前面（联系得上才有价值）
    if (hasWx(r)) total += 8;
    // 有粉丝数据的排前面
    if (!isUnk(r[4])) total += 3;
    return total;
  }

  // 词区分度：该词在全量数据里命中率过高（如"科技""百货"）→ 说明没有辨识度，降权
  // 用倒排索引懒加载，只在搜索时算一次
  let _invIdx = null;
  function invIdx(){
    if (_invIdx) return _invIdx;
    const m = new Map();
    const push = (k, r)=>{ if(!k) return; let s=m.get(k); if(!s){ s=new Set(); m.set(k,s); } s.add(r); };
    ALL.forEach(r=>{
      // 覆盖全部文本字段（含地址），否则稀有词识别不出来
      [1,2,3,8,9,10,11,12,13].forEach(i=>{
        const v = r[i]; if (isUnk(v)) return;
        const s = String(v).toLowerCase();
        const seen = new Set();                    // 按字段隔离，跨字段不去重
        for (let L=2; L<=6; L++){
          if (L > s.length) break;
          for (let p=0; p+L<=s.length; p++){
            const g = s.slice(p,p+L);
            if (!seen.has(g)) { push(g, r); seen.add(g); }
          }
        }
      });
    });
    _invIdx = m;
    return m;
  }
  // 返回该词在全量的命中占比 0~1
  function idf(t){
    if (t.length < 2) return 0;
    const m = invIdx();
    // 只查原词；查不到说明该词不在任何字段里 → 无用词，给中性值
    const s = m.get(t);
    if (!s) return 0.5;
    return s.size / ALL.length;
  }
  // 区分度系数：结合「占比」与「绝对命中数」
  // 关键洞察：命中数 >= 8 的词，往往是同一云仓/同一批采集的共性字段，
  // 对"区分到某一个达人"没有帮助，必须压权，否则会把一堆无关行顶到前面。
  function idfFactor(t){
    const m = invIdx().get(t);
    if (!m) return 1.0;                       // 查不到：中性
    const n = m.size, f = n / ALL.length;
    // 绝对命中数惩罚（业务阈值）
    let cap = 1.0;
    if (n >= 60)      cap = 0.45;
    else if (n >= 30) cap = 0.60;
    else if (n >= 15) cap = 0.78;
    else if (n >= 8)  cap = 0.90;
    // 占比加成（数据驱动的稀有度）
    let base = 1.0;
    if (f <= 0.002 && n < 8)      base = 1.35;
    else if (f <= 0.01 && n < 15) base = 1.18;
    else if (f <= 0.05)           base = 1.02;
    else if (f <= 0.15)           base = 0.88;
    else                          base = 0.70;
    return Math.min(base, cap) === cap ? cap : base;
  }

  // 拆分检索词：先整串，再按空格拆
  function parseTerms(q){
    const raw = String(q||'').trim();
    if (!raw) return [];
    const whole = raw.toLowerCase().replace(/\s+/g,'');
    const parts = raw.toLowerCase().split(/[\s,，、;；]+/).map(s=>s.trim()).filter(Boolean);
    // 整串去空格后与某一段相同 → 只用一个词（避免"晨 小安"被拆成两个单字）
    if (parts.length > 1 && parts.includes(whole)) return [whole];
    // 单字词自动合并到前一词（"晨 小安" → "晨小安"）
    if (parts.length > 1 && parts.some(p=>p.length===1)){
      const merged = parts.join('');
      if (merged.length <= 12) return [merged];
    }
    return parts.length ? parts : [whole];
  }

  let toastT;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900); }

  // ---------- 相似算法 ----------
  // 归一化昵称：去空白/符号/emoji，转小写
  function normNick(s){
    return String(s==null?'':s)
      .replace(/\s+/g,'')
      .replace(/[·•・\.\-_—–~!@#$%^&*()（）【】\[\]{}<>《》"'\`|\\\/,，。:：;；?？+=]/g,'')
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
      .toLowerCase();
  }
  function bigrams(s){
    const out=[];
    if(s.length<=2){ if(s) out.push(s); return out; }
    for(let i=0;i<s.length-1;i++) out.push(s.slice(i,i+2));
    return out;
  }
  // Dice 系数
  function dice(a,b){
    if(a===b) return 1;
    const A=bigrams(a), B=bigrams(b);
    if(!A.length||!B.length) return 0;
    const m=new Map(); A.forEach(g=>m.set(g,(m.get(g)||0)+1));
    let hit=0;
    B.forEach(g=>{ const c=m.get(g)||0; if(c>0){ hit++; m.set(g,c-1);} });
    return 2*hit/(A.length+B.length);
  }
  function lcpLen(a,b){
    const n=Math.min(a.length,b.length); let i=0;
    while(i<n && a[i]===b[i]) i++;
    return i;
  }
  const isValidWx = v => {
    const s=String(v||'').trim();
    if(s.length<5) return false;
    if(/^[\d\-_\.\s]+$/.test(s)) return false;        // 纯数字/符号不算
    return /[A-Za-z]/.test(s);
  };

  // 微信/昵称里的通用前缀（运营商拼音、常见词），不构成"相似"
  const WX_STOP = new Set(['weixin','wechat','wx','wxid','id','vx','v','qq','tel','phone','abc','test','admin','user','shop','vip']);

  // 微信号相似：必须有实质重合，不能只是同前缀
  function wxSim(x,y){
    if(!x||!y) return 0;
    if(x===y) return 1;
    const l=lcpLen(x,y), ml=Math.min(x.length,y.length);
    // 前缀长度占较短串 70% 以上才叫相似（huangyixuan0277 vs huangyanqing-01 → 5/14=36%，判否）
    if(l>=5 && l/ml>=0.7) return Math.min(0.95, 0.55+l*0.05);
    if(x.includes(y)||y.includes(x)){
      const ratio=ml/Math.max(x.length,y.length);
      if(ratio>=0.6) return 0.8;
    }
    // 数字后缀相同（如 xxx0277 与 yyy0277）噪声太大，不采纳
    return 0;
  }

  // 字段相似：属性接近的达人（可替代人选）
  // 现实约束：平台字段 60% 为空，不能做硬门槛，改为「有值才加分」
  // 属性相似：找「同平台 + 同带货等级 + 同类型」的可替代达人
  // 注：本表中小达人的粉丝数高度聚集（同批次采集），故粉丝量只做"否决"不做"加分"
  function fieldSim(a,b){
    // 硬门槛1：平台必须都有值且相同
    if(!a[0] || a[0]!==b[0]) return 0;
    // 硬门槛2：带货等级必须都有值且相同（核心判据）
    if(!a[6] || !b[6] || a[6]!==b[6]) return 0;
    // 硬门槛3：粉丝量级不能在 3 倍之外
    const fa=Number(a[4])||0, fb=Number(b[4])||0;
    if(fa>0 && fb>0 && Math.abs(Math.log(fa/fb))>Math.LN2*1.585) return 0;
    let s=0.55;                                      // 同平台 + 同等级 = 0.55
    if(a[5] && b[5] && a[5]===b[5]) s+=0.30;         // 同类型 +0.30
    else if(!a[5] || !b[5]) s+=0.10;                 // 类型缺失，给部分分
    if(fa>0 && fb>0){
      const r=Math.abs(Math.log(fa/fb));
      s+=0.15*Math.max(0, 1-r/Math.LN2);
    }
    return Math.min(s, 1);
  }

  // 运营号/店铺号黑名单：搜出来没意义
  const JUNK_NICK = /(快手小店|抖音小店|官方旗舰店|旗舰店|专卖店|专营店|企业店|小店|直播间|福利号|官方账号|客服)/;
  const isJunk = r => JUNK_NICK.test(String(r[1]||''));

  function buildSim(base, others){
    const bn = normNick(base[1]);
    const nick=[], wx=[], fld=[];
    const bnLen = bn.length;
    others.forEach(r=>{
      if(r===base) return;
      const on = normNick(r[1]);
      const onLen = on.length;

      // A 昵称相似
      let ns = 0;
      if(bnLen>=2 && onLen>=2){
        ns = dice(bn, on);
        if(on.includes(bn) || bn.includes(on)){
          // 短串占比过低（如"安"命中一堆）不算
          const ml=Math.min(bnLen,onLen), mx=Math.max(bnLen,onLen);
          if(ml>=2 && ml/mx>=0.5) ns = Math.max(ns, 0.82);
        }
      }
      if(ns>=0.62 && !isJunk(r)) nick.push({r, s:ns});

      // C 微信号相似
      const bws=[base[8],base[9],base[10]].filter(isValidWx).map(x=>String(x).toLowerCase());
      const rws=[r[8],r[9],r[10]].filter(isValidWx).map(x=>String(x).toLowerCase());
      let ws=0;
      bws.forEach(x=>{ if(WX_STOP.has(x)) return; rws.forEach(y=>{ if(WX_STOP.has(y)) return;
        const cur=wxSim(x,y); if(cur>ws) ws=cur; }); });
      if(ws>=0.75) wx.push({r, s:ws});

      // B 属性相似
      const fs=fieldSim(base,r);
      if(fs>=0.75 && !isJunk(r)) fld.push({r, s:fs});
    });
    const cut = arr => arr.sort((a,b)=>b.s-a.s).slice(0,CAND_MAX);
    return {nick:cut(nick), wx:cut(wx), field:cut(fld)};
  }

  // ---------- build filters ----------
  function buildFilters(){
    const plats={}, types={}, levels={};
    ALL.forEach(r=>{
      const p = isUnk(r[0]) ? UNK : r[0];
      const t = isUnk(r[5]) ? UNK : r[5];
      const l = isUnk(r[6]) ? UNK : r[6];
      plats[p]=(plats[p]||0)+1; types[t]=(types[t]||0)+1; levels[l]=(levels[l]||0)+1;
    });
    // 排序：未知永远排最后
    const sorter = (a,b) => (a[0]===UNK?1:0)-(b[0]===UNK?1:0) || b[1]-a[1];
    const fPlat=$('#fPlat');
    Object.entries(plats).sort(sorter).forEach(([k,v])=>{
      const c=el('button','chip'+(k===UNK?' unkchip':''), esc(k)+' <span style="opacity:.55">'+v+'</span>');
      c.dataset.plat=k; fPlat.appendChild(c);
    });
    const fType=$('#fType');
    Object.entries(types).sort(sorter).forEach(([k,v])=>{
      const c=el('button','chip'+(k===UNK?' unkchip':''), esc(k)+' <span style="opacity:.55">'+v+'</span>');
      c.dataset.type=k; fType.appendChild(c);
    });
    const fLevel=$('#fLevel');
    Object.keys(levels).sort((a,b)=>(a===UNK?1:0)-(b===UNK?1:0) || a.localeCompare(b)).forEach(k=>{
      const o=el('option',null,esc(k)); o.value=k; fLevel.appendChild(o);
    });

    // 赛道：以蝉妈妈标准体系为全集，只显示有数据 + 未知
    const cntT={}, cntC={};
    ALL.forEach(r=>{
      const t=isUnk(r[14])?UNK:r[14], c=isUnk(r[15])?UNK:r[15];
      cntT[t]=(cntT[t]||0)+1; cntC[c]=(cntC[c]||0)+1;
    });
    const fill=(box, all, cnt, attr)=>{
      // 有数据的先排（按数量降序），没数据的不显示；未知排最后
      const keys = Object.keys(cnt).filter(k=>k!==UNK);
      keys.sort((a,b)=>{
        const ia=all.indexOf(a), ib=all.indexOf(b);
        if(ia>=0&&ib>=0) return ia-ib;
        return (cnt[b]||0)-(cnt[a]||0);
      });
      keys.forEach(k=>{
        const c=el('button','chip', esc(k)+' <span style="opacity:.55">'+cnt[k]+'</span>');
        c.dataset[attr]=k; box.appendChild(c);
      });
      if(cnt[UNK]){
        const c=el('button','chip unkchip', UNK+' <span style="opacity:.55">'+cnt[UNK]+'</span>');
        c.dataset[attr]=UNK; box.appendChild(c);
      }
    };
    // 赛道/分类全集顺序：标准表在前，未知在最后
    fill($('#fTrack'), TRACKS.concat([UNK]), cntT, 'track');
    fill($('#fCate'),  CATES.concat([UNK]),  cntC, 'cate');
  }

  // ---------- filter ----------
  function matches(r, terms, fmin, fmax){
    // 平台（含「未知」）
    if (state.plat.size){
      const p = isUnk(r[0]) ? UNK : r[0];
      if (!state.plat.has(p)) return false;
    }
    // 带货类型（含「未知」）
    if (state.type.size){
      const t = isUnk(r[5]) ? UNK : r[5];
      if (!state.type.has(t)) return false;
    }
    // 带货等级（含「未知」）
    if (state.level){
      const lv = isUnk(r[6]) ? UNK : r[6];
      if (lv !== state.level) return false;
    }
    if (state.onlyWx && !hasWx(r)) return false;
    if (state.wxUnk && hasWx(r)) return false;
    if (state.salesUnk && !isUnk(r[7])) return false;
    if (state.fansUnk && !isUnk(r[4])) return false;
    // 达人赛道（含「未知」）
    if (state.track.size){
      const tk = isUnk(r[14]) ? UNK : r[14];
      if (!state.track.has(tk)) return false;
    }
    // 带货分类（含「未知」）
    if (state.cate.size){
      const ct = isUnk(r[15]) ? UNK : r[15];
      if (!state.cate.has(ct)) return false;
    }
    // 只看异常达人
    if (state.onlyAbn && r[16] !== ABNORMAL) return false;
    // 只看团标识
    if (state.onlyTeam && !isTeam(r)) return false;
    // 隐藏「未知」行：只看用户关心的字段（平台/类型/等级/销量/微信）
    if (state.hideUnk){
      if (isUnk(r[0]) || isUnk(r[5]) || isUnk(r[6]) || isUnk(r[7]) || !hasWx(r)) return false;
    }
    // 注：UID / 粉丝数 不参与，否则几乎全被剔除
    const fans = Number(r[4])||0;
    if (fmin!==null && fans<fmin) return false;
    if (fmax!==null && fans>fmax) return false;
    if (terms.length){
      for (const t of terms) if (rowScore(r, [t]) < 0) return false;
    }
    return true;
  }

  function apply(){
    const terms = parseTerms(state.q);
    state.terms = terms;
    const fmin = state.fmin===''?null:Number(state.fmin);
    const fmax = state.fmax===''?null:Number(state.fmax);

    let acc = ALL.filter(r=>matches(r, terms, fmin, fmax));

    state.simInfo = null;
    state.markSet = null;
    state.scored = false;
    state.scoreMap = null;
    state.dupGroups = null;

    // 关键词加权排序（有搜索词且用户未手动排序时生效）
    if (terms.length && state.sortKey < 0){
      const scored = acc.map(r => {
        const raw = rowScore(r, terms);
        if (raw <= 0) return null;
        // 按各词的区分度加权：稀有词贡献大，"烂大街"词贡献小
        let f = 1;
        for (const t of terms) f *= idfFactor(t);
        f = Math.pow(f, 1 / Math.max(1, terms.length));
        return {r, s: raw * f};
      }).filter(Boolean);
      scored.sort((a,b) => b.s - a.s);
      acc = scored.map(o => o.r);
      const sm = new Map(); scored.forEach(o => sm.set(o.r, o.s));
      state.scoreMap = sm;
      state.scored = true;
    }
    state.exactN = acc.length;

    if (state.sim && state.q){
      // 尊重筛选条件：相似搜索的候选池也过一遍筛选
      const pool = ALL.filter(r=>matches(r, [], fmin, fmax));
      const hidden = new Set(acc);
      const others = pool.filter(r=>!hidden.has(r));
      const g = buildSim(acc[0], others);
      state.simInfo = g;
      const marks = new Set();
      g.nick.forEach(o=>marks.add(o.r)); g.wx.forEach(o=>marks.add(o.r)); g.field.forEach(o=>marks.add(o.r));
      state.markSet = marks;
      // 精准结果 + 相似结果合并入表
      const merged = acc.concat(Array.from(marks));
      acc = merged;
    }

    state.result = acc;
    // 相似结果入表后，按权重重排一次（保证精准行在最前，且按分数降序）
    if (state.sim && state.q && terms.length && state.sortKey < 0){
      const sm = state.scoreMap || new Map();
      state.result.sort((a,b)=>{
        const sa = sm.get(a) != null ? sm.get(a) : -1;
        const sb = sm.get(b) != null ? sm.get(b) : -1;
        return sb - sa;
      });
    }
    if (state.sortKey>=0 && !(state.sim && state.q)){
      const k=state.sortKey, d=state.sortDir;
      state.result.sort((a,b)=>{
        const x=a[k], y=b[k];
        const nx=Number(x), ny=Number(y);
        if (!isNaN(nx)&&!isNaN(ny)&&x!==''&&y!=='') return (nx-ny)*d;
        return String(x).localeCompare(String(y),'zh')*d;
      });
    }
    // 同名/同号不同人检测：昵称相同但达人号或UID不同的分组
    state.dupGroups = detectDups(acc);

    state.page=1;
    renderSim();
    renderWarn();
    renderDups();
    render();
  }

  // ---------- 异常/团 提示条 ----------
  function renderWarn(){
    const box=$('#warnPanel'); box.innerHTML='';
    const res=state.result;
    const abns=res.filter(r=>r[16]===ABNORMAL);
    if (!abns.length) return;
    const card=el('div','warnbar');
    const cp = v => '<span class="cpv" data-copy="'+esc(v)+'" title="点击复制：'+esc(v)+'">'+esc(v)+'<span class="cp">⧉</span></span>';
    card.innerHTML='<span class="wi">⚠️</span><div style="flex:1">'+
      '<b>当前结果中有 '+abns.length+' 位被标记为「异常达人」</b>'+
      '<p>存在骗样、虚假、诈骗、恶意沟通等风险记录，合作前请谨慎核实。</p>'+
      '<div class="list">'+abns.slice(0,8).map(r=>
        '· '+(r[1]?cp(r[1]):'—')+'（号 '+(r[2]?cp(r[2]):'—')+'）'+
        (r[8]?' · 微信 '+cp(r[8]):'')+
        (r[12]?' · '+cp(r[12]):'')
      ).join('<br>')+(abns.length>8?'<br>… 其余见表格（已红色标注）':'')+'</div>'+
    '</div>';
    box.appendChild(card);
  }

  // ---------- 同名不同人检测 ----------
  function detectDups(rows){
    if (rows.length < 2 || rows.length > 400) return null;
    const byNick = new Map();
    rows.forEach(r=>{
      const k = normNick(r[1]);
      if (!k || k.length < 2) return;
      if (!byNick.has(k)) byNick.set(k, []);
      byNick.get(k).push(r);
    });
    const groups = [];
    byNick.forEach((list, k)=>{
      if (list.length < 2) return;
      // 用 达人号 + UID 做身份指纹，指纹不同的才是"不同的人"
      const ids = new Set(list.map(r => (r[2]||'')+'|'+(r[3]||'')).filter(x=>x!=='|'));
      if (ids.size > 1) groups.push({key:k, list});
    });
    return groups.length ? groups : null;
  }

  function renderDups(){
    const box = $('#dupPanel'); box.innerHTML='';
    const gs = state.dupGroups; if (!gs) return;
    const card = el('div','dupcard');
    card.appendChild(el('h3',null,
      '<span class="badge w">注意</span>发现 <b>'+gs.length+'</b> 组同名达人，可能是<b>不同的人</b>'+
      '<span class="n" style="margin-left:auto;font-weight:400">按「达人号 / UID」区分身份</span>'));
    const body = el('div','dupbody');
    gs.slice(0,6).forEach(g=>{
      const row = el('div','duprow');
      const idset = {};
      g.list.forEach(r=>{ const id=(r[2]||'—')+'|'+(r[3]||'—'); idset[id]=(idset[id]||0)+1; });
      row.innerHTML =
        '<div class="dupnick">'+esc(g.list[0][1]||'—')+'<span style="color:var(--tx3);font-weight:400"> ×'+g.list.length+'</span></div>'+
        '<div class="dupids">'+Object.keys(idset).map(id=>{
          const [h,u]=id.split('|');
          return '<span class="dupchip">号 '+esc(h)+' · UID '+esc(u)+'</span>';
        }).join('')+'</div>';
      body.appendChild(row);
    });
    if (gs.length > 6) body.appendChild(el('div','simempty','… 共 '+gs.length+' 组，当前结果内可见'));
    card.appendChild(body);
    box.appendChild(card);
  }

  // ---------- render similar panel ----------
  function renderSim(){
    const box=$('#simPanel'); box.innerHTML='';
    const g=state.simInfo;
    if(!g) return;
    const base = state.result[0];
    const baseName = base ? (base[1]||'—') : '—';

    const card=el('div','simcard');
    const title=el('h3',null,
      '<span class="badge s">基准达人</span>'+esc(baseName)+
      ' <span class="n">· 平台 '+esc(base[0]||'—')+' · 粉丝 '+fmt(base[4])+' · 等级 '+esc(base[6]||'—')+'</span>');
    card.appendChild(title);

    const body=el('div','simbody');

    const mk=(label,badge,cls,list,render)=>{
      const b=el('div','simblock');
      b.appendChild(el('h4',null,'<span class="badge '+cls+'">'+badge+'</span> '+label+' <span style="opacity:.7">'+list.length+' 位</span>'));
      if(!list.length){ b.appendChild(el('div','simempty','暂无命中')); return b; }
      list.slice(0,12).forEach(o=>{
        const row=el('div','simrow');
        row.innerHTML = render(o);
        row.onclick=()=>{ state.q=o.r[1]; $('#q').value=o.r[1]; $('#clr').classList.add('on'); apply(); };
        b.appendChild(row);
      });
      if(list.length>12) b.appendChild(el('div','simempty','… 表格中共 '+list.length+' 位，见下方列表'));
      return b;
    };

    body.appendChild(mk('昵称相似','A','t', g.nick, o=>
      '<span class="nm">'+esc(o.r[1]||'—')+'</span>'+

  // ---------------- 统一复制（全站可复制） ----------------
  //  三层兜底：① Clipboard API  ② execCommand  ③ 选中文本提示手动复制
  function copyText(text){
    return new Promise(resolve=>{
      const t = String(text==null?'':text);
      if (!t) return resolve(false);
      // ① 现代 API（需 https 或 localhost）
      if (navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(t).then(()=>resolve(true)).catch(()=>fallback());
        return;
      }
      fallback();
      // ② execCommand 兜底
      function fallback(){
        try{
          const ta = document.createElement('textarea');
          ta.value = t;
          ta.setAttribute('readonly','');
          ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
          document.body.appendChild(ta);
          ta.select(); ta.setSelectionRange(0, t.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          resolve(!!ok);
        }catch(_){ resolve(false); }
      }
    });
  }

  // 写入异常标（只写不改：仅在云端无标记时补充标记，绝不覆盖已有数据）
  async function saveAbnormal(r){
    const rec = {
      handle: r[2]||null, uid: r[3]||null, nickname: r[1]||'',
      abnormal: ABNORMAL, editor: '2517'
    };
    // 本地留痕（记录谁在什么时间标了谁，便于追溯）
    try{
      const k = 'daren_abn_v1';
      const arr = JSON.parse(localStorage.getItem(k)||'[]');
      arr.push({t:Date.now(), ...rec});
      localStorage.setItem(k, JSON.stringify(arr));
    }catch(_){}
    if (!isCfgOk()) return;
    try{
      // 先按 达人号 / UID 找已有记录
      let q = null;
      if (r[2]) q = 'handle=eq.'+encodeURIComponent(r[2]);
      else if (r[3]) q = 'uid=eq.'+encodeURIComponent(r[3]);
      if (!q) return;
      const found = await cbFetch('/'+CB.table+'?'+q+'&select=id,abnormal&limit=1');
      if (Array.isArray(found) && found.length){
        // 已存在异常标记 → 不重复写，避免覆盖他人操作
        if (found[0].abnormal === ABNORMAL) return;
        await cbFetch('/'+CB.table+'?id=eq.'+encodeURIComponent(found[0].id),
                      {method:'PATCH', body:{abnormal: ABNORMAL, editor:'2517'}});
      } else {
        try{
          await cbFetch('/'+CB.table, {method:'POST', body:Object.assign({}, rec, {source:'web'})});
        }catch(e2){
          // 撞唯一索引（并发录入）→ 重新查出 id 再 PATCH
          if (e2.dup){
            const again = await cbFetch('/'+CB.table+'?'+q+'&select=id,abnormal&limit=1');
            if (Array.isArray(again) && again.length && again[0].abnormal !== ABNORMAL){
              await cbFetch('/'+CB.table+'?id=eq.'+encodeURIComponent(again[0].id),
                            {method:'PATCH', body:{abnormal: ABNORMAL, editor:'2517'}});
            }
          } else throw e2;
        }
      }
    }catch(err){ toast('云端同步失败，已存本机'); }
  }

    if(!res.length) return toast('当前没有可导出的结果');
    const q=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const lines=[HEADER.join(',')];
    res.forEach(r=>lines.push(r.map(q).join(',')));
    const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='达人查询结果_'+new Date().toISOString().slice(0,10)+'_'+res.length+'条.csv';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出 '+fmt(res.length)+' 条');
  };

  // ============================================================
  //  CloudBase 后端（达人人人可录入 · 增量数据）
  // ============================================================
  const CB = {
    url:    (window.__CB_CONFIG__ && window.__CB_CONFIG__.URL)   || '',
    key:    (window.__CB_CONFIG__ && window.__CB_CONFIG__.KEY)   || '',
    table:  (window.__CB_CONFIG__ && window.__CB_CONFIG__.TABLE) || 'creators',
    ready:  false
  };

  // 统一请求封装（CloudBase PG 模式 · RDB RESTful = PostgREST 风格）
  // 真实端点：https://{env}.api.tcloudbasegateway.com/v1/rdb/rest/{table}
  async function cbFetch(path, opt){
    const o = opt || {};
    const res = await fetch(CB.url + path, {
      method: o.method || 'GET',
      headers: Object.assign({
        'Authorization': 'Bearer ' + CB.key,
        'Content-Type': 'application/json',
        'Accept': 'application/json',
        'Prefer': o.prefer || 'return=representation'
      }, o.headers || {}),
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch(_){ data = txt; }
    if (!res.ok){
      // 唯一索引冲突：达人号 / UID 已存在 → 交给调用方转"补充模式"
      const code = data && (data.code || '');
      if (res.status === 409 || String(code).indexOf('23505') >= 0){
        const e = new Error('该达人已存在');
        e.dup = true;
        throw e;
      }
      throw new Error((data && (data.message||data.error||data.code)) || ('HTTP '+res.status));
    }
    return data;
  }

  const isCfgOk = () => !!(CB.key && CB.key.length > 40 && CB.url);

  // ---------- 行 ↔ 对象 ----------
  function rowToObj(r){
    return {
      platform: r[0]||null, nickname: r[1]||'', handle: r[2]||null, uid: r[3]||null,
      fans: (function(){ const n=Number(r[4]); return isUnk(r[4])?null:(isNaN(n)?null:n); })(),
      ctype: r[5]||null, clevel: r[6]||null,
      sales: (function(){ const n=Number(r[7]); return isUnk(r[7])?null:(isNaN(n)?null:n); })(),
      wx1: r[8]||null, wx2: r[9]||null, wx3: r[10]||null,
      receiver: r[11]||null, phone: r[12]||null, address: r[13]||null,
      track: r[14]||null, cate: r[15]||null, abnormal: r[16]||null
    };
  }
  function objToRow(o){
    return [
      o.platform||'', o.nickname||'', o.handle||'', o.uid||'',
      (o.fans==null?'':String(o.fans)), o.ctype||'', o.clevel||'',
      (o.sales==null?'':String(o.sales)),
      o.wx1||'', o.wx2||'', o.wx3||'',
      o.receiver||'', o.phone||'', o.address||'',
      o.track||'', o.cate||'', o.abnormal||'', ''
    ];
  }

  // ---------- 本地增量缓存 ----------
  const LSKEY = 'daren_extra_v1';
  function loadLocal(){ try { return JSON.parse(localStorage.getItem(LSKEY)||'[]'); } catch(_){ return []; } }
  function saveLocal(arr){ try { localStorage.setItem(LSKEY, JSON.stringify(arr)); } catch(_){} }

  function mergeRemote(list){
    list.forEach(o=>{
      const row = objToRow(o);
      row.__id = o.id;              // 云端真实主键，后续 PATCH 靠它
      row.__src = 'remote';
      ALL.push(row);
    });
  }

  // 单条新增后回填真实 id（避免后续补充联系方式时 PATCH 失败）
  async function fillRemoteId(row, handle, uid){
    if (!isCfgOk()) return;
    try{
      let q = handle ? 'handle=eq.'+encodeURIComponent(handle)
            : uid ? 'uid=eq.'+encodeURIComponent(uid) : null;
      if (!q) return;
      const r = await cbFetch('/'+CB.table+'?'+q+'&select=id&limit=1');
      if (Array.isArray(r) && r.length){
        row.__id = r[0].id;
        row.__src = 'remote';
      }
    }catch(_){}
  }

  // ---------- 启动时拉取云端增量 ----------
  async function syncRemote(){
    if (!isCfgOk()) return {ok:false, n:0, why:'未配置'};
    try{
      const data = await cbFetch('/'+CB.table+'?select=*&order=created_at.desc&limit=2000');
      if (Array.isArray(data)){
        // ① 先把云端的增量字段（赛道/分类/异常）合并到已有行
        const byHandle = new Map(), byUid = new Map(), byId = new Map();
        ALL.forEach(r=>{ if(r[2]) byHandle.set(String(r[2]).trim(), r); if(r[3]) byUid.set(String(r[3]).trim(), r); });
        let patched = 0;
        const fresh = [];
        data.forEach(o=>{
          const h = o.handle ? String(o.handle).trim() : '';
          const u = o.uid ? String(o.uid).trim() : '';
          const hit = (h && byHandle.get(h)) || (u && byUid.get(u)) || null;
          if (hit){
            // 已存在的行：只补增量字段，不覆盖本地已有值
            let ch = false;
            if (!hit[14] && o.track){ hit[14] = o.track; ch = true; }
            if (!hit[15] && o.cate){ hit[15] = o.cate; ch = true; }
            if (o.abnormal === ABNORMAL){ if (hit[16] !== ABNORMAL){ hit[16] = ABNORMAL; ch = true; } }
            if (ch) patched++;
            return;
          }
          fresh.push(o);
        });
        mergeRemote(fresh);
        CB.ready = true;
        return {ok:true, n:fresh.length, patched:patched, total:data.length};
      }
    }catch(e){
      return {ok:false, n:0, why:e.message};
    }
    return {ok:false, n:0, why:'未知'};
  }

  // ---------- 查重：达人号 / UID ----------
  function findExisting(row){
    const h = String(row[2]||'').trim();
    const u = String(row[3]||'').trim();
    if (!h && !u) return null;
    let byHandle=null, byUid=null;
    for (const r of ALL){
      if (h && String(r[2]||'').trim() === h && !byHandle) byHandle = r;
      if (u && String(r[3]||'').trim() === u && !byUid)   byUid = r;
      if (byHandle && byUid) break;
    }
    return byHandle || byUid || null;
  }

  // 提交前向云端确认是否已存在（本地 5 万条 + 云端增量都查）
  async function findExistingRemote(handle, uid){
    if (!isCfgOk()) return null;
    const q = handle ? 'handle=eq.'+encodeURIComponent(handle)
            : uid ? 'uid=eq.'+encodeURIComponent(uid) : null;
    if (!q) return null;
    try{
      const r = await cbFetch('/'+CB.table+'?'+q+'&select=*&limit=1');
      if (Array.isArray(r) && r.length) return r[0];
    }catch(_){}
    return null;
  }

  // ============================================================
  //  批量导入表格（异形表智能识别列名）
  // ============================================================
  //  设计原则：不做固定模板，任何表都能进。
  //  靠「别名映射表」把各种列名归一到内部字段，再让用户人工确认一遍。
  // ============================================================

  // 内部字段定义 + 别名库（越全容错越高）
  const IMP_FIELDS = [
    { k:'nickname', label:'达人昵称', req:true,
      alias:['达人昵称','昵称','达人名称','达人','博主','博主名','账号名称','账号名','账户名','名称','达人名','红人','红人昵称','kol','达人账号','抖音昵称','快手昵称','视频号昵称','用户名','用户昵称','creators','creator','nickname','name','达人姓名'] },
    { k:'handle',   label:'达人号',
      alias:['达人号','抖音号','快手号','视频号','账号','账号id','抖音id','快手id','抖音账号','账号昵称','主页','主页id','userid','账户','号','handle','account','抖音','快手','平台账号','达人账号id','唯一号'] },
    { k:'uid',      label:'达人UID',
      alias:['达人uid','uid','用户id','达人id','抖音uid','快手uid','抖音用户id','用户uid','数字id','user_id','sec_uid','secuid','达人唯一id'] },
    { k:'fans',     label:'粉丝数',
      alias:['粉丝数','粉丝','粉丝量','粉丝数量','关注数','fans','粉丝(万)','粉丝数(万)','粉丝w','总粉丝数','粉丝总数'] },
    { k:'wx1',      label:'微信号',
      alias:['微信号','微信','vx','v信','微信id','微信号码','微信账号','加v','联系方式','微信号1','微信1','客服微信','达人微信','商务微信','wx','wechat','微信/电话','微信或电话','微信号/手机号'] },
    { k:'wx2',      label:'微信号2',
      alias:['微信号2','微信2','备用微信','第二微信','微信二','小号微信','wx2'] },
    { k:'wx3',      label:'微信号3',
      alias:['微信号3','微信3','微信三','wx3'] },
    { k:'phone',    label:'收货人手机号',
      alias:['收货人手机号','手机号','手机','电话','联系电话','手机号码','收货人电话','电话号','手机号1','tel','phone','mobile','联系方式电话','联系号码'] },
    { k:'receiver', label:'收货人',
      alias:['收货人','收件人','收货人姓名','收件人姓名','联系人','联系人姓名','姓名','收货姓名','客户名','收货人名称','联系人名称'] },
    { k:'address',  label:'收货地址',
      alias:['收货地址','地址','详细地址','收件地址','收货人地址','所在地区','地区','地址详情','邮寄地址','收货信息'] },
    { k:'platform', label:'平台',
      alias:['平台','所属平台','渠道','平台名称','来源平台'] },
    { k:'clevel',   label:'带货等级',
      alias:['带货等级','等级','级别','达人等级','带货级别','lv'] },
    { k:'ctype',    label:'带货类型',
      alias:['带货类型','类型','直播类型','带货方式'] },
    { k:'track',    label:'达人赛道',
      alias:['达人赛道','赛道','达人类型','内容赛道'] },
    { k:'cate',     label:'带货分类',
      alias:['带货分类','分类','品类','带货品类'] },
    { k:'sales',    label:'近30日销量',
      alias:['近30日销量','销量','销售额','近30天销量','30日销量','月销量','销量(件)'] }
  ];

  // 归一化列名：去空格/换行/标点/全角，转小写，便于匹配
  function normCol(s){
    return String(s==null?'':s)
      .replace(/[\s\u3000]/g,'')
      .replace(/[（(].*?[)）]/g,'')          // 去掉括号补充说明，如「粉丝数(万)」
      .replace(/[*:：、,，.。\-_/\\|]/g,'')
      .replace(/[\uFF01-\uFF5E]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
      .toLowerCase();
  }

  // 必须忽略的列（序号/备注等，防止污染识别）
  const IMP_IGNORE = /^(序号|编号|no|index|id序|行号|备注|remark|note|说明|标签|状态|操作|日期|时间|创建时间|更新时间|添加时间|统计|合计|小计)$/;

  // 从列名提取单位倍数（表头写「粉丝数(万)」→ 值需 ×10000）
  function colUnit(name){
    const s = String(name||'');
    if (/[（(]\s*万\s*[)）]|万粉|粉丝.*万|万$/.test(s)) return 10000;
    if (/[（(]\s*[wW]\s*[)）]/.test(s)) return 10000;
    if (/[（(]\s*千\s*[)）]/.test(s)) return 1000;
    if (/[（(]\s*[kK]\s*[)）]/.test(s)) return 1000;
    return 1;
  }

  // 自动识别：列名 → 内部字段
  function autoMatch(rawName){
    const n = normCol(rawName);
    if (!n) return '';
    if (IMP_IGNORE.test(n)) return '';   // 序号/备注类，永不映射
    // ① 完全相等
    for (const f of IMP_FIELDS) if (f.alias.some(a=>normCol(a)===n)) return f.k;
    // ② 别名被包含（列名里含别名，或别名含列名）
    for (const f of IMP_FIELDS) if (f.alias.some(a=>{ const na=normCol(a); return na && (n.indexOf(na)>=0 || na.indexOf(n)>=0); })) return f.k;
    // ③ 模糊兜底（关键词）
    if (/微信|vx|wechat|v信/.test(n))             return n.indexOf('2')>=0?'wx2':n.indexOf('3')>=0?'wx3':'wx1';
    if (/手机|电话|tel|phone|mobile/.test(n))     return 'phone';
    if (/收货|收件|邮寄/.test(n) && /地址|addr/.test(n)) return 'address';
    if (/收货人|收件人|联系人|姓名/.test(n))       return 'receiver';
    if (/uid|用户id|sec/.test(n))                 return 'uid';
    if (/抖音号|快手号|达人号|账号|主页|抖音id/.test(n))  return 'handle';
    if (/昵称|博主|名称|达人|红人/.test(n))        return 'nickname';
    if (/粉丝/.test(n))                           return 'fans';
    if (/销量|销售额/.test(n))                     return 'sales';
    if (/等级|lv|级别/.test(n))                    return 'clevel';
    if (/平台|渠道/.test(n))                       return 'platform';
    return '';
  }

  // 值清洗：11位手机号 ↔ 微信号 混装拆分（历史数据常见）
  function splitPhoneWx(v){
    const s = String(v==null?'':v).trim();
    if (!s) return { phone:'', wx:'' };
    if (/^1[3-9]\d{9}$/.test(s.replace(/[\s-]/g,''))) return { phone:s.replace(/[\s-]/g,''), wx:'' };
    return { phone:'', wx:s };
  }

  // 从标签包 `[{phone xxx} {wechat xxx}]` 提取
  function extractTags(v){
    const s = String(v==null?'':v);
    const phone = (s.match(/phone\s*[:：]?\s*([0-9\-]{7,})/i)||[])[1] || '';
    const wx    = (s.match(/wechat\s*[:：]?\s*([A-Za-z0-9_\-]+)/i)||[])[1] || '';
    return { phone, wx };
  }

  // 导入状态
  let impState = { rows:[], header:[], map:{}, fileName:'', raw:[] };

  function openImp(){
    impState = { rows:[], header:[], map:{}, fileName:'', raw:[] };
    $('#impBody').innerHTML = impDropHTML();
    $('#impTip').textContent = '';
    $('#impGo').style.display = 'none';
    $('#impBack').style.display = 'none';
    $('#impModal').classList.add('on');
    const drop = $('#impDrop');
    if (drop){
      drop.onclick = ()=> $('#impFile').click();
      drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
      drop.ondragleave = () => drop.classList.remove('on');
      drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); if (e.dataTransfer.files[0]) readImpFile(e.dataTransfer.files[0]); };
    }
  }

  function impDropHTML(){
    return '<div class="impdrop" id="impDrop">'+
      '<div class="big">⇪</div>'+
      '<div class="t1">拖入表格文件，或点击选择</div>'+
      '<div class="t2">支持 .xlsx / .xls / .csv　·　列名不用改，系统自动识别</div>'+
    '</div>'+
    '<div class="mnote" style="margin-top:14px">'+
      '<b>列名随便叫，系统会自己认。</b>比如「博主名」「账号名称」「达人」都认作<b>达人昵称</b>；'+
      '「vx」「微信id」「加v」都认作<b>微信号</b>。识别结果下一步会列出来，你可以手动改。'+
    '</div>';
  }

  function readImpFile(file){
    impState.fileName = file.name;
    const fr = new FileReader();
    fr.onload = e => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
        // 去掉全空行
        const rows = aoa.filter(r => r.some(c => String(c==null?'':c).trim() !== ''));
        if (rows.length < 2) return impErr('表格里没读到数据（至少要有表头 + 1 行数据）');
        // 找表头行：前 5 行里非空单元格最多的一行
        let hi = 0, best = -1;
        for (let i=0; i<Math.min(5, rows.length); i++){
          const n = rows[i].filter(c=>String(c==null?'':c).trim()!=='').length;
          if (n > best){ best = n; hi = i; }
        }
        impState.header = rows[hi].map(c=>String(c==null?'':c).trim());
        impState.raw = rows.slice(hi+1);
        // 自动映射
        const map = {}, used = {};
        impState.header.forEach((h,i)=>{
          const k = autoMatch(h);
          // 同一字段只认第一个（wx1/wx2/wx3 除外，允许重复）
          if (k && (used[k] && ['wx1','wx2','wx3'].indexOf(k)<0 ? false : true)){
            if (!used[k] || ['wx1','wx2','wx3'].indexOf(k)>=0){ map[i] = k; used[k]=true; }
          }
        });
        // 多个微信号列 → 自动排成 wx1/wx2/wx3
        const wxCols = Object.keys(map).filter(i=>map[i]==='wx1');
        wxCols.forEach((i,n)=>{ map[i] = n===0?'wx1':n===1?'wx2':n===2?'wx3':'wx1'; });
        impState.map = map;
        renderImpMap();
      }catch(err){ impErr('读取失败：'+err.message); }
    };
    fr.readAsArrayBuffer(file);
  }

  function impErr(msg){ $('#impBody').innerHTML = '<div class="mnote warn">'+esc(msg)+'</div>'; }

  function renderImpMap(){
    const { header, map, raw } = impState;
    const mapped = Object.keys(map).filter(i=>map[i]);
    const hasNick = mapped.some(i=>map[i]==='nickname');
    const hasWx   = mapped.some(i=>['wx1','wx2','wx3'].includes(map[i]));
    const hasPhone= mapped.some(i=>map[i]==='phone');

    // 统计
    let html = '<div class="impstat">'+
      '<div class="s info"><b>'+fmt(raw.length)+'</b><span>表格数据行</span></div>'+
      '<div class="s ok"><b>'+header.length+'</b><span>识别到 '+mapped.length+' 列</span></div>'+
      '<div class="s '+(hasNick?'ok':'warn')+'"><b>'+(hasNick?'✓':'!')+'</b><span>达人昵称</span></div>'+
      '<div class="s '+(hasWx?'ok':'warn')+'"><b>'+(hasWx?'✓':'!')+'</b><span>微信号</span></div>'+
      '<div class="s '+(hasPhone?'ok':'warn')+'"><b>'+(hasPhone?'✓':'!')+'</b><span>手机号</span></div>'+
    '</div>';

    html += '<div class="mnote'+(hasNick?' ok':' warn')+'">'+
      (hasNick
        ? '已识别列名对应关系。<b>可以手动改成其他字段</b>，或选「忽略此列」。确认无误后点右下角「确认导入」。'
        : '⚠️ <b>没识别出「达人昵称」列</b>，请在下面手动指定，否则无法导入。')+
    '</div>';

    // 字段冲突检测：同一字段被多列映射
    const cnt = {};
    mapped.forEach(i=>{ cnt[map[i]] = (cnt[map[i]]||0)+1; });
    const conflicts = Object.keys(cnt).filter(k=>cnt[k]>1 && ['wx1','wx2','wx3'].indexOf(k)<0);
    if (conflicts.length){
      const names = conflicts.map(k=>{ const f=IMP_FIELDS.find(x=>x.k===k); return (f?f.label:k)+' ×'+cnt[k]; }).join('、');
      html += '<div class="mnote warn">⚠️ <b>字段冲突：</b>'+esc(names)+
              ' 被多列同时映射，只会保留其中一列。请把多余的列改成「忽略此列」。</div>';
    }

    // 映射表
    html += '<div class="impsep">列名对应关系</div>';
    html += '<table class="impmap"><thead><tr><th style="width:26%">表格里的列名</th><th style="width:14%">识别</th><th>对应到我们的字段</th><th style="width:30%">示例值</th></tr></thead><tbody>';
    header.forEach((h,i)=>{
      const cur = map[i] || '';
      const sample = raw.slice(0,3).map(r=>String(r[i]==null?'':r[i]).trim()).filter(Boolean)[0] || '';
      html += '<tr>'+
        '<td class="colname">'+esc(h||'（空列名 '+(i+1)+'）')+'</td>'+
        '<td>'+(cur?'<span class="hit">✓ 已识别</span>':'<span class="miss">— 未识别</span>')+'</td>'+
        '<td><select data-col="'+i+'">'+
          '<option value=""'+(cur===''?' selected':'')+'>— 忽略此列 —</option>'+
          IMP_FIELDS.map(f=>'<option value="'+f.k+'"'+(cur===f.k?' selected':'')+'>'+esc(f.label)+'</option>').join('')+
        '</select></td>'+
        '<td style="color:var(--tx3);font-size:11.5px">'+esc(sample.slice(0,26))+'</td>'+
      '</tr>';
    });
    html += '</tbody></table>';

    // 预览
    const prevCols = header.map((h,i)=>({h,i})).filter(o=>map[o.i]);
    if (prevCols.length){
      html += '<div class="impsep">数据预览（前 5 行）</div>';
      html += '<div class="impprev"><table><thead><tr>'+
        prevCols.map(o=>'<th>'+esc(IMP_FIELDS.find(f=>f.k===map[o.i]).label)+'</th>').join('')+
      '</tr></thead><tbody>';
      impState.raw.slice(0,5).forEach(r=>{
        html += '<tr>'+prevCols.map(o=>'<td title="'+esc(r[o.i])+'">'+esc(String(r[o.i]==null?'':r[o.i]).slice(0,32))+'</td>').join('')+'</tr>';
      });
      html += '</tbody></table></div>';
    }

    $('#impBody').innerHTML = html;
    $('#impGo').style.display = '';
    $('#impBack').style.display = '';
    // 改映射 → 重绘
    $('#impBody').querySelectorAll('select[data-col]').forEach(sel=>{
      sel.onchange = () => {
        const i = Number(sel.dataset.col);
        const v = sel.value;
        // 同一字段唯一（wx1/wx2/wx3 例外）
        if (v && ['wx1','wx2','wx3'].indexOf(v)<0){
          Object.keys(impState.map).forEach(j=>{ if (Number(j)!==i && impState.map[j]===v) delete impState.map[j]; });
        }
        if (v) impState.map[i] = v; else delete impState.map[i];
        renderImpMap();
      };
    });
  }

  // 把一行表格 → 内部对象
  function rowToEntry(rawRow, headerRow){
    const o = {};
    Object.keys(impState.map).forEach(i=>{
      const k = impState.map[i];
      const v = String(rawRow[i]==null?'':rawRow[i]).trim();
      if (!v) return;
      // 去掉 [] {} () 等包裹符，还原干净值
      const clean = v.replace(/^[\[{（(【]+/,'').replace(/[\]}）)】]+$/,'').trim();
      if (k==='wx1' || k==='wx2' || k==='wx3'){
        // 标签包优先
        const tags = extractTags(v);
        let w = tags.wx || clean;
        let p = tags.phone || '';
        if (k==='wx1'){
          // 混装值拆分
          const sp = splitPhoneWx(w);
          if (sp.phone && !o.phone) o.phone = sp.phone;
          w = sp.wx || w;
          o.phone = o.phone || p || null;
        }
        // 规则：11位手机号 → phone；其他任何值 → 原样进微信字段（不丢数据）
        if (/^1[3-9]\d{9}$/.test(String(w).replace(/[\s-]/g,''))){
          if (!o.phone) o.phone = String(w).replace(/[\s-]/g,'');
        } else if (String(w).trim()){
          const slot = ['wx1','wx2','wx3'].find(s=>!o[s]);
          if (slot) o[slot] = String(w).trim();
        }
      } else if (k==='phone'){
        const tags = extractTags(v);
        const sp = splitPhoneWx(tags.phone || clean);
        if (sp.phone) o.phone = sp.phone;
        else if (sp.wx){ const slot=['wx1','wx2','wx3'].find(s=>!o[s]); if(slot) o[slot]=sp.wx; }
      } else if (k==='fans' || k==='sales'){
        // 支持：12000 / 1.2万 / 1.2w / 3,500 / 3.5千
        let s = String(v).replace(/[,，\s]/g,'');
        let n = NaN, mul = 1;
        const mm = s.match(/([\d.]+)\s*(万|w|W|千|k|K)?/);
        if (mm){
          n = Number(mm[1]);
          const unit = mm[2];
          if (unit === '万' || unit === 'w' || unit === 'W') mul = 10000;
          else if (unit === '千' || unit === 'k' || unit === 'K') mul = 1000;
        }
        // 表头带单位（如「粉丝数(万)」）→ 再乘一次
        if (mul === 1 && headerRow) mul = colUnit(headerRow[i]);
        o[k] = isNaN(n) ? null : Math.round(n * mul);
      } else {
        o[k] = clean || v;
      }
    });
    return o;
  }

  // 执行导入
  async function doImport(){
    const btn = $('#impGo'); btn.disabled = true;
    const setT = m => { $('#impTip').textContent = m; };
    try{
      const map = impState.map;
      const hasNick = Object.keys(map).some(i=>map[i]==='nickname');
      const hasId   = Object.keys(map).some(i=>map[i]==='handle' || map[i]==='uid');
      if (!hasNick){ setT('请先指定「达人昵称」列'); btn.disabled=false; return; }
      if (!hasId){ setT('至少要有「达人号」或「达人UID」才能查重'); btn.disabled=false; return; }

      // ① 解析 + 去重（按 handle>uid>昵称）
      const seen = new Map();
      let parsed = 0, skipped = 0;
      impState.raw.forEach(r=>{
        const o = rowToEntry(r, impState.header);
        if (!o.nickname && !o.handle && !o.uid){ skipped++; return; }
        const key = (o.handle && 'h:'+String(o.handle).trim().toLowerCase())
                 || (o.uid && 'u:'+String(o.uid).trim())
                 || (o.nickname && 'n:'+String(o.nickname).trim());
        if (seen.has(key)){ skipped++; return; }
        seen.set(key, o); parsed++;
      });
      const list = [...seen.values()];

      setT('正在核对云端（共 '+list.length+' 条）…');

      // ② 逐条判断：新增 or 补充
      let added = 0, patched = 0, failed = 0, noChange = 0;
      for (let i=0; i<list.length; i++){
        const o = list[i];
        if (i % 20 === 0) setT('导入中… '+i+' / '+list.length+'（新增 '+added+' · 补充 '+patched+'）');
        try{
          // 先查本地 5 万条
          const fakeRow = objToRow(o);
          let hit = findExisting(fakeRow);
          let remoteId = null;
          if (hit && hit.__id != null) remoteId = hit.__id;
          if (!hit && isCfgOk() && (o.handle || o.uid)){
            const r = await findExistingRemote(o.handle, o.uid);
            if (r){ remoteId = r.id; hit = objToRow(r); }
          }

          if (remoteId != null){
            // 已存在 → 只补空字段
            const patch = {};
            ['wx1','wx2','wx3','phone','receiver','address'].forEach(k=>{
              const oldV = hit ? String(hit[IDX[k]]||'').trim() : '';
              const newV = String(o[k]||'').trim();
              if (!oldV && newV) patch[k] = newV;   // 只在原值为空时才补
            });
            ['track','cate'].forEach(k=>{
              const oldV = hit ? String(hit[EX[k === 'track' ? 'track' : 'cate']]||'').trim() : '';
              if (!oldV && o[k]) patch[k] = o[k];
            });
            if (Object.keys(patch).length === 0){ noChange++; continue; }
            if (isCfgOk()){
              await cbFetch('/'+CB.table+'?id=eq.'+encodeURIComponent(remoteId), { method:'PATCH', body:patch });
              patched++;
            } else noChange++;
          } else {
            // 新增
            if (isCfgOk()){
              const body = Object.assign({}, o, { source:'import', editor:'2517' });
              try{
                await cbFetch('/'+CB.table, { method:'POST', body });
                added++;
              }catch(e){
                if (e.dup){ failed++; }  // 并发撞库，跳过
                else throw e;
              }
            } else {
              // 没配云端 → 存本地
              const local = loadLocal();
              local.push(o); saveLocal(local);
              const row = objToRow(o); row.__src = 'local';
              ALL.push(row);
              added++;
            }
          }
        }catch(e){ failed++; }
      }

      btn.disabled = false;
      $('#impTip').textContent = '';
      closeImp();
      // 刷新云端增量（把刚导入的拉回来）
      if (isCfgOk()){
        const r = await syncRemote();
        if (r && r.ok) console.log('[导入] 云端回拉', r);
      }
      apply();
      toast('导入完成：新增 '+added+' · 补充 '+patched+' · 无变化 '+noChange+(failed?(' · 失败 '+failed):'')+(skipped?(' · 跳过 '+skipped):''));
    }catch(e){
      btn.disabled = false;
      setT('导入出错：'+e.message);
    }
  }

  function closeImp(){ $('#impModal').classList.remove('on'); }

  // ---------- 弹窗 ----------
  let entryMode = 'new';     // 'new' | 'patch'
  let patchTarget = null;
  let originalVals = {};     // 补充模式下的原始联系方式，用于「只补不改」

  const FIELDS = [
    {k:'platform', label:'平台',      type:'text',  ph:'抖音 / 快手…'},
    {k:'nickname', label:'达人昵称',  type:'text',  ph:'必填', req:true},
    {k:'handle',   label:'达人号',    type:'text',  ph:'抖音号（身份识别优先用它）'},
    {k:'uid',      label:'达人UID',   type:'text',  ph:'数字 UID（达人选达人号时可只填它）'},
    {k:'fans',     label:'粉丝数',    type:'number',ph:'如 12500'},
    {k:'ctype',    label:'带货类型',  type:'text',  ph:'如 美食 / 母婴'},
    {k:'clevel',   label:'带货等级',  type:'text',  ph:'如 L3 / 铜牌'},
    {k:'sales',    label:'近30日销量',type:'number',ph:'如 320'},
    {k:'wx1',      label:'达人微信号', type:'text', ph:'含字母才算有效'},
    {k:'wx2',      label:'达人微信号2',type:'text', ph:''},
    {k:'wx3',      label:'达人微信号3',type:'text', ph:''},
    {k:'receiver', label:'收货人',    type:'text',  ph:''},
    {k:'phone',    label:'收货人手机号',type:'text',ph:''},
    {k:'address',  label:'收货人地址',type:'text',  ph:'', wide:true},
    {k:'track',    label:'达人赛道（内容向）', type:'select', opts:TRACKS},
    {k:'cate',     label:'带货分类（品类向）', type:'select', opts:CATES}
  ];
  // 「补联系方式」只开这几项（用户明确：微信号、手机号、收货人、收货地址）
  const PATCH_KEYS = ['wx1','wx2','wx3','phone','receiver','address'];

  function openEntry(prefill, mode, target){
    entryMode = mode || 'new';
    patchTarget = target || null;
    originalVals = {};   // 记录进入补充模式时的原始值，用于「只补不改」
    const isPatch = entryMode === 'patch';
    $('#mTitle').textContent = isPatch ? '补充联系方式' : '新增达人录入';
    $('#mSubmit').textContent = isPatch ? '提交补充' : '提交录入';
    $('#mTip').textContent = '';
    $('#mTip').className = 'mtip';

    const pre = prefill || {};
    if (isPatch){ PATCH_KEYS.forEach(k=>{ originalVals[k] = String(pre[k]||'').trim(); }); }
    let html = '';

    if (isPatch && target){
      html += '<div class="mrow-hit"><b>已存在这条达人记录</b>'+
              '<div class="kv"><span>昵称：'+esc(target[1]||'—')+'</span>'+
              '<span>达人号：'+esc(target[2]||'—')+'</span>'+
              '<span>UID：'+esc(target[3]||'—')+'</span></div></div>'+
              '<div class="mnote ok">名录里已有这位达人。你只需补充<b>联系方式类</b>信息，'+
              '会直接合并到原记录上，不会产生重复行。</div>';
    } else {
      html += '<div class="mnote">填多少算多少，<b>昵称 / 达人号 / UID 至少填一个</b>。'+
              '提交后立即生效，所有打开本页的人都能搜到。</div>';
    }

    html += '<div class="fgrid">';
    FIELDS.forEach(f=>{
      const patchable = PATCH_KEYS.indexOf(f.k) >= 0;
      const show = isPatch ? patchable : true;
      if (!show) return;
      const v = pre[f.k] != null ? pre[f.k] : '';
      // 已有值的联系方式一律锁定（只补不改）：覆盖全部 6 个联系方式字段
      const ro = isPatch && patchable && !!String(pre[f.k] || '').trim();
      html += '<div class="fitem'+(f.wide?' wide':'')+'">'+
        '<label>'+esc(f.label)+(f.req?' <span class="req">*</span>':'')+(ro?' <span style="color:var(--ok);font-weight:400">已填</span>':'')+'</label>';
      if (f.type === 'select'){
        const cur = pre[f.k] || '';
        html += '<select data-k="'+f.k+'"'+(ro?' disabled':'')+'>'+
          '<option value="">— 未选择 —</option>'+
          f.opts.map(o=>'<option value="'+esc(o)+'"'+(o===cur?' selected':'')+'>'+esc(o)+'</option>').join('')+
        '</select>';
      } else {
        const dis = ro ? ' readonly' : '';
        html += '<input type="'+f.type+'" data-k="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+dis+'>';
      }
      html += '</div>';
    });
    html += '</div>';
    $('#mBody').innerHTML = html;
    $('#modal').classList.add('on');
    setTimeout(()=>{ const i=$('#mBody input:not([readonly])'); if(i) i.focus(); },60);
  }

  function closeModal(){ $('#modal').classList.remove('on'); patchTarget = null; originalVals = {}; }

  function collect(){
    const o = {};
    $('#mBody').querySelectorAll('[data-k]').forEach(inp=>{
      const k = inp.dataset.k; let v = String(inp.value||'').trim();
      // 补充模式：原记录已有值的不提交；空值也不提交（只做「填空」）
      if (entryMode === 'patch' && PATCH_KEYS.indexOf(k) >= 0){
        if (originalVals[k]) return;   // 原本就有值 → 跳过
        if (!v) return;                // 本次仍为空 → 跳过，不发无意义写入
      }
      if (k==='fans' || k==='sales'){ o[k] = v===''?null:Number(v); }
      else o[k] = v || null;
    });
    return o;
  }

  function setTip(msg, cls){ const t=$('#mTip'); t.textContent=msg; t.className='mtip '+(cls||''); }

  // ---------- 提交 ----------
  async function submitEntry(){
    const o = collect();
    const isPatch = entryMode === 'patch';

    // 补充模式：没有任何「空白可补」字段 → 直接提示，避免发空请求
    if (isPatch && Object.keys(o).length === 0){
      return setTip('这位达人的联系方式已齐全，暂无需补充', 'err');
    }

    if (!isPatch){
      if (!o.nickname && !o.handle && !o.uid){
        return setTip('昵称 / 达人号 / UID 至少填一个', 'err');
      }
      // 客户端查重（本地 5 万条）
      let dup = findExisting([o.platform||'', o.nickname||'', o.handle||'', o.uid||'',
                              '', '', '', '', '', '', '', '', '', '']);
      // 再向云端确认一次（别人的录入本地没有）
      if (!dup && (o.handle || o.uid)){
        setTip('正在核对是否已存在…');
        const remote = await findExistingRemote(o.handle, o.uid);
        if (remote){
          const row = objToRow(remote);
          row.__id = remote.id; row.__src = 'remote';
          ALL.push(row);
          dup = row;
        }
        setTip('');
      }
      if (dup){
        closeModal();
        openEntry({
          nickname: dup[1], handle: dup[2], uid: dup[3],
          wx1: dup[8], wx2: dup[9], wx3: dup[10],
          receiver: dup[11], phone: dup[12], address: dup[13]
        }, 'patch', dup);
        toast('这位达人已存在，请补充联系方式');
        return;
      }
    }

    const btn = $('#mSubmit'); btn.disabled = true; setTip('提交中…');

    // 1) 写云端
    let cloudOk = false, cloudErr = '', cloudDup = false;
    if (isCfgOk()){
      try{
        if (isPatch && patchTarget && patchTarget.__id != null){
          await cbFetch('/'+CB.table+'?id=eq.'+encodeURIComponent(patchTarget.__id),
                        {method:'PATCH', body:o});
        } else {
          await cbFetch('/'+CB.table, {method:'POST', body:Object.assign({}, o, {source:'web', editor:'2517'})});
        }
        cloudOk = true;
      }catch(e){
        cloudErr = e.message;
        if (e.dup) cloudDup = true;
      }
    }

    // 云端判定重复 → 自动转"补充联系方式"模式，不写本地
    if (cloudDup){
      btn.disabled = false;
      closeModal();
      const dupRow = findExisting([o.platform||'', o.nickname||'', o.handle||'', o.uid||'',
                                   '', '', '', '', '', '', '', '', '', '']);
      if (dupRow){
        openEntry({
          nickname: dupRow[1], handle: dupRow[2], uid: dupRow[3],
          wx1: dupRow[8], wx2: dupRow[9], wx3: dupRow[10],
          receiver: dupRow[11], phone: dupRow[12], address: dupRow[13]
        }, 'patch', dupRow);
        toast('这位达人已存在，请直接补充联系方式');
      } else {
        toast('该达人号/UID 已存在，请换个关键词搜出来补充');
      }
      return;
    }

    // 2) 本地兜底（云端失败也不丢数据）
    const local = loadLocal();
    local.push({t: Date.now(), mode: entryMode, data: o});
    saveLocal(local);

    // 3) 本地内存立即生效
    if (isPatch && patchTarget){
      const r = patchTarget;
      if (o.wx1) r[8]=o.wx1; if (o.wx2) r[9]=o.wx2; if (o.wx3) r[10]=o.wx3;
      if (o.receiver) r[11]=o.receiver; if (o.phone) r[12]=o.phone; if (o.address) r[13]=o.address;
    } else {
      const row = objToRow(o); row.__src = cloudOk ? 'remote' : 'local';
      ALL.push(row);
      // 回填云端真实 id，否则后续"补充联系方式"时 PATCH 找不到记录
      if (cloudOk) await fillRemoteId(row, o.handle, o.uid);
    }

    btn.disabled = false;
    closeModal();
    apply();

    if (cloudOk) toast(isPatch ? '补充已生效' : '录入成功，已生效');
    else if (!isCfgOk()) toast('已保存在本机（云端未配置，仅你可见）');
    else toast('云端写入失败，已存本机：'+cloudErr.slice(0,40));
  }

  // 事件
  $('#newBtn').onclick = ()=>{
    const pre = state.q ? {nickname: /[\u4e00-\u9fa5]/.test(state.q) ? state.q : '', handle: /^[A-Za-z0-9_.\-]+$/.test(state.q) ? state.q : ''} : {};
    openEntry(pre, 'new');
  };
  $('#mClose').onclick = closeModal;
  $('#mCancel').onclick = closeModal;
  $('#mSubmit').onclick = submitEntry;
  $('#modal').addEventListener('click', e=>{ if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e=>{ if (e.key === 'Escape'){ closeModal(); closeImp(); } });

  // 导入表格
  $('#impBtn').onclick = openImp;  $('#impClose').onclick = closeImp;
  $('#impCancel').onclick = closeImp;
  $('#impGo').onclick = doImport;
  $('#impBack').onclick = openImp;
  $('#impModal').addEventListener('click', e=>{ if (e.target.id === 'impModal') closeImp(); });
  $('#impFile').onchange = e => { const f = e.target.files[0]; if (f) readImpFile(f); e.target.value = ''; };

  // ---------- 公告区 ----------
  (function initNotice(){
    // 用户主动关闭过 → 记住，不再打扰
    if (localStorage.getItem('daren_notice_off') === '1'){
      const n = $('#notice'); if (n) n.classList.add('off');
      return;
    }
    $('#noticeClose').onclick = ()=>{
      $('#notice').classList.add('off');
      try{ localStorage.setItem('daren_notice_off','1'); }catch(_){}
    };
  })();

  // ---------- init ----------
  (async function boot(){
    try{
      // 先用本地静态数据渲染，不等网络
      buildFilters(); buildHead(); apply();
      $('#sTotal').textContent=fmt(ALL.length);
      $('#loading').classList.add('off');

      // 后台拉取云端增量
      const r = await syncRemote();
      if (r.ok && r.n > 0){
        apply();
        $('#sTotal').textContent=fmt(ALL.length);
        toast('已同步 '+r.n+' 条共建数据');
      }
    }catch(err){
      $('#loadTxt').textContent='页面初始化失败：'+err.message;
      $('#pbar').style.width='100%';
    }
  })();
})();
</script>
